<!DOCTYPE html><html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soleilenterrasse">
  <meta name="format-detection" content="telephone=no">
  <title>Soleilenterrasse</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.104/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.104/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --yellow: #F8C83E; --yellow-2: #FFE07A; --yellow-bg: #FFF7D6;
      --shade: #7C8798; --shade-bg: #EDF1F6;
      --blue: #1677FF; --green: #1FA774; --coral: #F05E4B;
      --text: #15171A; --text-2: #5E6470; --text-3: #9AA1AD;
      --divider: #E4E7EC; --panel-w: 380px;
      --radius-md: 12px; --radius-sm: 8px;
      --glass: rgba(255,255,255,0.9);
      --white: #FFFFFF; --bg: #F6F7F9;
      --shadow-soft: 0 14px 38px rgba(15, 23, 42, 0.13);
      --shadow-card: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .panel-map input[type=range] { touch-action: pan-x; }
    #cesiumContainer { touch-action: none; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; background: #000; position: fixed; inset: 0; color: var(--text); }

    #splash { position: fixed; inset: 0; z-index: 1000; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
    #splash.out { opacity: 0; pointer-events: none; }
    .splash-sun { width: 90px; height: 90px; margin-bottom: 24px; animation: splash-pulse 2.5s ease-in-out infinite; }
    @keyframes splash-pulse { 0%,100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.07) rotate(6deg);} }
    .splash-name { font-size: 32px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; margin-bottom: 8px; }
    .splash-name em { font-family: Arial, sans-serif; font-style: italic; font-weight: 700; }
    .splash-name span { font-family: Arial, sans-serif; font-style: normal; font-weight: 700; }
    .splash-tagline { font-size: 14px; color: var(--text-2); text-align: center; line-height: 1.5; max-width: 220px; font-family: Arial, sans-serif; }
    .splash-tagline strong { color: var(--yellow); font-weight: 600; }
    .splash-progress-wrap { position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%); width: 140px; }
    .splash-progress-track { width: 100%; height: 2px; background: #E5E5EA; border-radius: 2px; overflow: hidden; }
    .splash-progress-bar { height: 100%; border-radius: 2px; background: var(--yellow); width: 0%; transition: width 0.25s ease; }
    .splash-status { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--text-3); white-space: nowrap; }

    #cesiumContainer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
    .cesium-widget canvas { outline: none !important; }
    .cesium-selection-wrapper, .cesium-infoBox { display: none !important; }
    .cesium-widget-credits { display: none !important; }

    #topBar {
      position: fixed; top: calc(env(safe-area-inset-top, 44px) + 12px); left: 50%;
      transform: translate3d(-50%, 0, 0); -webkit-transform: translate3d(-50%, 0, 0);
      will-change: transform; isolation: isolate; z-index: 30;
      width: calc(100% - 32px); max-width: 480px; display: flex; align-items: center; gap: 10px;
    }
    .search-glass {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: var(--glass); backdrop-filter: blur(24px) saturate(1.15); -webkit-backdrop-filter: blur(24px) saturate(1.15);
      border-radius: 16px; padding: 0 14px; height: 52px;
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.86);
      border: 1px solid rgba(255,255,255,0.72);
    }
    .search-glass svg { flex-shrink: 0; opacity: 0.35; }
    #searchInput { flex: 1; border: none; background: transparent; font: inherit; font-size: 15px; color: var(--text); outline: none; }
    #searchInput::placeholder { color: var(--text-3); }
    .search-clear-btn { background: none; border: none; cursor: pointer; color: var(--text-3); font-size: 16px; padding: 0; display: none; align-items: center; justify-content: center; width: 20px; height: 20px; }
    .search-clear-btn.visible { display: flex; }
    .icon-btn {
      flex-shrink: 0; width: 52px; height: 52px; background: var(--glass);
      backdrop-filter: blur(24px) saturate(1.15); -webkit-backdrop-filter: blur(24px) saturate(1.15);
      border: 1px solid rgba(255,255,255,0.6); border-radius: 15px;
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.86);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.2s ease; -webkit-transform: translate3d(0, 0, 0);
      will-change: transform; isolation: isolate;
    }
    .icon-btn:hover { transform: translateY(-1px); }
    .icon-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.98); }

    /* Bouton géoloc flottant en bas à droite */
    #btnGeo {
      position: fixed; bottom: calc(env(safe-area-inset-bottom,34px) + 140px); right: 16px;
      z-index: 31; width: 50px; height: 50px;
      background: var(--glass); backdrop-filter: blur(24px) saturate(1.15); -webkit-backdrop-filter: blur(24px) saturate(1.15);
      border: 1px solid rgba(255,255,255,0.6); border-radius: 15px;
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.86);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s, background 0.15s;
    }
    #btnGeo:active { transform: scale(0.94); background: rgba(255,255,255,0.98); }
    #btnGeo.locating { animation: geo-pulse 1s ease-in-out infinite; }
    @keyframes geo-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    #locationPill {
      position: fixed; top: calc(env(safe-area-inset-top, 44px) + 74px); left: 50%;
      transform: translateX(-50%); z-index: 29; display: none; align-items: center; gap: 7px;
      height: 34px; max-width: calc(100% - 40px); padding: 0 12px; border-radius: 999px;
      background: rgba(255,255,255,0.88); border: 1px solid rgba(255,255,255,0.7);
      backdrop-filter: blur(20px) saturate(1.18); -webkit-backdrop-filter: blur(20px) saturate(1.18);
      box-shadow: 0 8px 24px rgba(15,23,42,0.12), inset 0 1px 0 rgba(255,255,255,0.85);
      color: var(--text); font-size: 12px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #locationPill.visible { display: flex; }
    .location-dot { width: 8px; height: 8px; border-radius: 50%; background: #007AFF; box-shadow: 0 0 0 4px rgba(0,122,255,0.14); flex-shrink: 0; }
    #mode3dPill {
      position: fixed; top: calc(env(safe-area-inset-top, 44px) + 114px); left: 50%; transform: translateX(-50%);
      z-index: 29; display: none; align-items: center; justify-content: center; min-height: 32px; max-width: calc(100% - 40px);
      padding: 7px 12px; border-radius: 999px; background: rgba(20,22,26,0.82); color: #fff;
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); font-size: 11px; font-weight: 800; text-align: center;
      box-shadow: 0 8px 24px rgba(15,23,42,0.18);
    }

    .panel-map {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 34px) + 16px); left: 50%;
      transform: translateX(-50%); background: var(--glass);
      backdrop-filter: blur(24px) saturate(1.15); -webkit-backdrop-filter: blur(24px) saturate(1.15);
      border: 1px solid rgba(255,255,255,0.7); padding: 16px 24px 14px; border-radius: 22px;
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.86);
      text-align: center; z-index: 30; width: 82%; max-width: 400px;
    }
    .panel-map h3 { margin: 0 0 12px 0; font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .panel-map h3 .heure { font-size: 18px; font-weight: 800; color: var(--text); font-family: inherit; }
    .panel-map input[type=range] { width: 100%; cursor: pointer; -webkit-appearance: none; height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--yellow) var(--pct,46%), rgba(0,0,0,0.1) var(--pct,46%)); outline: none; }
    .panel-map input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: white; border: 3px solid var(--yellow); box-shadow: 0 4px 16px rgba(0,0,0,0.18); cursor: pointer; }
    .panel-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--text-3); font-weight: 500; }

    #tooltip { position: fixed; z-index: 50; background: rgba(20,20,22,0.93); color: white; padding: 12px 18px; border-radius: 16px; font-size: 15px; font-weight: 600; pointer-events: none; opacity: 0; transform: translateY(6px); transition: opacity 0.18s, transform 0.18s; backdrop-filter: blur(12px); max-width: 260px; text-align: center; border: 1px solid rgba(255,255,255,0.08); }
    #tooltip.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    #tooltip .tt-type { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px; font-weight: 400; font-family: Arial, sans-serif; }
    #tooltip .tt-sun { font-size: 13px; font-weight: 600; margin-top: 6px; font-family: Arial, sans-serif; }
    #tooltip .tt-sun.sun { color: var(--yellow); }
    #tooltip .tt-sun.shade { color: #90CAF9; }
    #tooltip .tt-sun.utility { color: #B8F7D4; }

    #drawer { position: fixed; z-index: 40; background: linear-gradient(180deg, rgba(255,255,255,0.98), #F8FAFC 46%, #F5F7FA); display: flex; flex-direction: column; transition: transform 0.42s cubic-bezier(0.22,0.9,0.18,1); box-shadow: -22px 0 48px rgba(15,23,42,0.16); }
    @media (min-width: 641px) { #drawer { top:0; right:0; width:var(--panel-w); height:100vh; border-left:1px solid rgba(255,255,255,0.6); transform:translateX(110%); } #drawer.open { transform:translateX(0); } }
    @media (max-width: 640px) { #drawer { left:0; bottom:0; width:100%; height:84vh; border-radius:20px 20px 0 0; border-top:1px solid rgba(255,255,255,0.75); box-shadow:0 -18px 52px rgba(15,23,42,0.2); transform:translateY(110%); } #drawer.open { transform:translateY(0); } }
    .drawer-handle { display:none; justify-content:center; padding:12px 0 4px; flex-shrink:0; cursor:pointer; }
    .drawer-bar { width:40px; height:4px; background:#E0E0E5; border-radius:2px; }
    @media (max-width:640px) { .drawer-handle { display:flex; } }
    .drawer-header { padding:20px 20px 0; flex-shrink:0; }
    .drawer-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .drawer-title { font-size: 22px; font-weight: 800; color: var(--text); }
    .drawer-title em { font-family: inherit; font-style: italic; font-weight: 800; }
    .drawer-title span { font-family: inherit; font-style: normal; color: var(--yellow); font-weight: 800; }
    #btnClose { background: var(--bg); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-2); transition: background 0.15s; }
    #btnClose:active { background: #E5E5EA; }
    .drawer-search { display: flex; align-items: center; gap: 8px; background: var(--white); border:1px solid rgba(226,232,240,0.9); border-radius: 12px; padding: 0 12px; height: 42px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); }
    .drawer-search svg { flex-shrink: 0; opacity: 0.3; }
    #drawerSearch { flex: 1; border: none; background: transparent; font: inherit; font-size: 15px; color: var(--text); outline: none; }
    #drawerSearch::placeholder { color: var(--text-3); }
    .filter-chips { display:flex; gap:8px; overflow-x:auto; padding:0 20px 12px; flex-shrink:0; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .filter-chips::-webkit-scrollbar { display:none; }
    .filter-chip { flex:0 0 auto; border:1px solid var(--divider); background:rgba(255,255,255,0.78); color:var(--text-2); border-radius:999px; height:32px; padding:0 12px; font-size:12px; font-weight:750; cursor:pointer; box-shadow:0 3px 10px rgba(15,23,42,0.04); transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease; }
    .filter-chip:hover { transform: translateY(-1px); }
    .filter-chip.active { background:var(--text); color:#fff; border-color:var(--text); }
    .section-title { padding:4px 20px 10px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .section-label { font-size:11px; font-weight:750; color:var(--text-3); text-transform:uppercase; letter-spacing:0.8px; }
    .count-pill { font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; background:var(--text); color:#fff; }
    #loadingState { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text-3); font-size:13px; }
    .spinner { width:24px; height:24px; border:2.5px solid var(--divider); border-top-color:var(--yellow); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .list { flex:1; overflow-y:auto; padding:0 12px 32px; -webkit-overflow-scrolling:touch; scrollbar-width:none; scroll-behavior:smooth; }
    .list::-webkit-scrollbar { display:none; }
    .card { display:flex; align-items:center; gap:12px; padding:10px; border-radius:var(--radius-md); cursor:pointer; transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease; border:1px solid rgba(226,232,240,0.78); background:rgba(255,255,255,0.86); margin-bottom:9px; box-shadow:0 5px 18px rgba(15,23,42,0.055); }
    .card:last-child { margin-bottom:0; }
    .card:hover { transform: translateY(-1px); box-shadow: var(--shadow-card); }
    .card:active, .card.active { transform: scale(0.985); background:var(--white); border-color:rgba(248,200,62,0.75); box-shadow:0 10px 28px rgba(248,200,62,0.16); }
    .card-photo-wrap { position:relative; width:76px; height:76px; border-radius:10px; overflow:hidden; flex-shrink:0; background:linear-gradient(135deg,#FFF7D6,#E7EEF8); }
    .card-photo { width:100%; height:100%; object-fit:cover; display:block; transform:scale(1.01); transition:transform 0.2s ease; }
    .photo-error .card-photo, .photo-error .sel-photo, .photo-error .ps-photo { display:none; }
    .photo-error::before { content:'☀️'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:26px; }
    .card:hover .card-photo { transform:scale(1.06); }
    .card.compact { gap:0; padding:12px 14px; min-height:68px; }
    .card.compact .card-name { font-size:14px; margin-bottom:4px; }
    .card.compact .card-sub { font-size:12px; }
    .card-body { flex:1; min-width:0; }
    .card-name { font-size:15px; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px; font-family: inherit; }
    .card-sub { font-size:12px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family: inherit; }
    .distance-pill { display:inline-flex; align-items:center; color:#007AFF; font-weight:800; }
    .category-icon { width:36px; height:36px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; font-weight:850; border:1px solid rgba(255,255,255,0.76); box-shadow:0 6px 16px rgba(15,23,42,0.08), inset 0 1px 0 rgba(255,255,255,0.7); }
    .category-icon.park { background:#DDF8EA; color:#0B7A45; }
    .category-icon.water { background:#DFF2FF; color:#007AFF; }
    .category-icon.parking { background:#EEF1F6; color:#526071; }
    .category-icon.cool { background:#E8F4FF; color:#276EF1; }
    .card.utility { gap:10px; }
    .utility-tag { display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:999px; background:#F1F5F9; color:#5E6470; font-size:10px; font-weight:850; }
    .utility-tag.heat { background:#EAFBF2; color:#12764A; }
    .card-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:6px; }
    .sun-status { display:inline-flex; align-items:center; justify-content:center; border-radius:999px; border:1px solid transparent; font-weight:850; white-space:nowrap; }
    .sun-status.sun { background:#FFF4C2; border-color:#F2CB45; color:#7A5200; }
    .sun-status.shade { background:#EDF1F6; border-color:#D7DEE8; color:#4D5968; }
    .sun-status.unknown { background:#F5F7FA; border-color:#E4E7EC; color:#7C8798; }
    .card-sun { font-size:11px; padding:4px 8px; }
    .no-results { padding:40px 20px; text-align:center; color:var(--text-3); font-size:13px; line-height:1.7; }
    .drawer-footer { padding:12px 20px; border-top:1px solid rgba(226,232,240,0.9); display:flex; align-items:center; gap:6px; flex-shrink:0; background:rgba(255,255,255,0.75); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .footer-text { font-size:10px; color:var(--text-3); }
    .live-dot { width:6px; height:6px; border-radius:50%; background:#30D158; animation:blink 2s ease-in-out infinite; flex-shrink:0; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .privacy-link { margin-left:auto; font-size:10px; color:var(--text-3); cursor:pointer; text-decoration:none; }

    /* ══ FICHE LIEU (bottom sheet) ══ */
    #psOverlay { position: fixed; inset: 0; z-index: 49; background: rgba(10,14,20,0.48); opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
    #psOverlay.open { opacity: 1; pointer-events: auto; }
    #placeSheet { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: var(--white); border-radius: 22px 22px 0 0; box-shadow: 0 -24px 70px rgba(15,23,42,0.28); transform: translateY(110%); transition: transform 0.42s cubic-bezier(0.22,0.9,0.18,1); overflow: hidden; max-height: 90vh; padding-bottom: env(safe-area-inset-bottom, 16px); }
    #placeSheet.open { transform: translateY(0); }
    .ps-handle { display: flex; justify-content: center; padding: 12px 0 6px; cursor: pointer; flex-shrink: 0; }
    .ps-bar { width: 40px; height: 4px; background: #E0E0E5; border-radius: 2px; }
    .ps-hero { position:relative; min-height:210px; background:linear-gradient(135deg,#1E293B,#475569); overflow:hidden; }
    .ps-photo { width: 100%; height: 230px; object-fit: cover; display: block; background: var(--bg); }
    .ps-hero::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(5,10,18,0.02) 18%,rgba(5,10,18,0.5) 100%); pointer-events:none; }
    .ps-photo-placeholder { width: 100%; height: 210px; background: linear-gradient(135deg,#FFF7D6,#DCEBFA); display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .photo-credit { display:none !important; }
    .ps-body { padding: 16px 20px 20px; }
    .ps-badge { display:inline-flex; align-items:center; gap:5px; background:linear-gradient(135deg,var(--yellow),var(--yellow-2)); color:#775400; font-size:11px; font-weight:800; padding:5px 10px; border-radius:20px; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.5px; }
    .ps-sun { font-size: 13px; padding:7px 11px; margin-bottom: 10px; font-family: inherit; }
    .ps-name { font-size: 24px; font-weight: 850; color: var(--text); margin-bottom: 4px; line-height: 1.14; font-family: inherit; }
    .ps-sub { font-size: 13px; color: var(--text-2); margin-bottom: 12px; line-height:1.45; font-family: inherit; }
    .ps-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 16px; }
    .ps-rating { display: inline-flex; align-items: center; gap: 5px; background: var(--bg); border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 750; color: var(--text); }
    .ps-happy { display:inline-flex; align-items:center; gap:5px; background:#FFF3D6; color:#9A6B00; border-radius:20px; padding:6px 12px; font-size:13px; font-weight:750; }
    .ps-facts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:0 0 14px; }
    .ps-fact { min-width:0; border:1px solid rgba(226,232,240,0.92); background:rgba(248,250,252,0.92); border-radius:14px; padding:10px 11px; }
    .ps-fact-label { font-size:10px; font-weight:850; color:var(--text-3); text-transform:uppercase; letter-spacing:0.55px; margin-bottom:3px; }
    .ps-fact-value { font-size:13px; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ps-insights { display:grid; gap:10px; margin: 0 0 16px; }
    .ps-insight { border:1px solid rgba(226,232,240,0.95); background:#F8FAFC; border-radius:12px; padding:10px 12px; }
    .ps-insight-title { font-size:11px; font-weight:850; color:var(--text-3); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:8px; }
    .sun-hours { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .sun-hour { min-width:0; text-align:center; border-radius:10px; padding:7px 2px; background:#EDF1F6; color:#667085; font-size:10px; font-weight:850; }

async function fetchWithTimeout(url, options={}, timeout=10000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    return await fetch(url, {...options, signal: controller.signal});
  } finally {
    clearTimeout(timer);
  }
}

async function setCurrentArea(lat, lng) {
  currentCity = {
    id: `gps-${lat.toFixed(3)}-${lng.toFixed(3)}`,
    nom: 'Autour de vous',
    lat,
    lng,
    dynamic: true
  };
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&lat=${lat}&lon=${lng}&accept-language=fr`;
    const response = await fetchWithTimeout(url, { headers: { Accept: 'application/json' } }, 5000);
    if (!response.ok) throw new Error();
    const data = await response.json();
    currentCity.nom = data.address?.city || data.address?.town || data.address?.village || data.address?.municipality || 'Autour de vous';
  } catch (e) {}
  updateLocationPill();
  return currentCity;
}

function updateLocationPill(accuracy){
  const pill = document.getElementById('locationPill');

}

}

function metersBetween(lat1,lng1,lat2,lng2){
  return Math.hypot((lat1-lat2)*111320,(lng1-lng2)*111320*Math.cos(((lat1+lat2)/2)*Math.PI/180));
}

let userDot = null, userHalo = null, userPulse = null, pulseT = 0, pulseStarted = false;
function makeUserDot() {
  const c = document.createElement('canvas'); c.width = 32; c.height = 32; const ctx = c.getContext('2d');
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1;
  ctx.beginPath(); ctx.arc(16,16,10,0,Math.PI*2); ctx.fillStyle='white'; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.arc(16,16,7.5,0,Math.PI*2); ctx.fillStyle='#007AFF'; ctx.fill();
  return c.toDataURL();
}
function placeUserDot(lng, lat, accuracy) {
  if (userDot) viewer.entities.remove(userDot);
  if (userHalo) viewer.entities.remove(userHalo);
  if (userPulse) viewer.entities.remove(userPulse);
  const pos = Cesium.Cartesian3.fromDegrees(lng, lat, 1);

  // Rond bleu de précision (taille = précision GPS réelle, comme Apple Plans)
  const radius = Math.min(Math.max(accuracy || 35, 20), 200);
  userHalo = viewer.entities.add({
    position: pos,
    ellipse: {
      semiMajorAxis: radius, semiMinorAxis: radius,
      material: Cesium.Color.fromCssColorString('rgba(0,122,255,0.15)'),
      outline: true, outlineColor: Cesium.Color.fromCssColorString('rgba(0,122,255,0.4)'), outlineWidth: 2,
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
    }
  });

  // Anneau pulsant
  userPulse = viewer.entities.add({
    position: pos,
    ellipse: {
      semiMajorAxis: new Cesium.CallbackProperty(() => 8 + 18 * (pulseT % 1), false),
      semiMinorAxis: new Cesium.CallbackProperty(() => 8 + 18 * (pulseT % 1), false),
      material: new Cesium.ColorMaterialProperty(
        new Cesium.CallbackProperty(() => Cesium.Color.fromCssColorString('#007AFF').withAlpha(0.4 * (1 - (pulseT % 1))), false)
      ),
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
    }
  });
  if (!pulseStarted) { pulseStarted = true; viewer.clock.onTick.addEventListener(() => { pulseT += 0.012; }); }

  // Point bleu central
  userDot = viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(lng, lat, 3),
    billboard: { image: makeUserDot(), verticalOrigin: Cesium.VerticalOrigin.CENTER, heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND, width: 32, height: 32, disableDepthTestDistance: Number.POSITIVE_INFINITY }
  });
  userLat = lat; userLng = lng;
  updateLocationPill(accuracy);
}

// Centre la caméra EXACTEMENT sur la position (le rond bleu au centre de l'écran)
// flyToBoundingSphere cale le centre de la sphère au centre de l'écran, même avec la vue inclinée
function focusUser(lng, lat, animate) {
  const sphere = new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(lng, lat, 0), 45);
  const hpr = new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-55), 300);
  viewer.camera.flyToBoundingSphere(sphere, { offset: hpr, duration: animate ? 1.2 : 0 });
}

// Géolocalisation manuelle (bouton) — recentre sur la position réelle
function geolocate(e) {
  if(e) e.preventDefault();
  if (!navigator.geolocation) { alert("Géolocalisation non disponible"); return; }
  const btn = document.getElementById('btnGeo'); btn.classList.add('locating');
  navigator.geolocation.getCurrentPosition(async pos => {
    btn.classList.remove('locating');
    const { longitude:lng, latitude:lat, accuracy } = pos.coords;
    placeUserDot(lng, lat, accuracy);
    await setCurrentArea(lat, lng);
    clearPlaces();
    focusUser(lng, lat, true);
    await loadTerrasses();
  }, err => {
    btn.classList.remove('locating');
    alert("Position introuvable. Vérifiez que la localisation est autorisée.");
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:0 });
}

const AMENITY_VALIDES = new Set([...FOOD_AMENITIES,'drinking_water','fountain','parking','bicycle_parking','library','cinema']);
const PLACE_CATEGORY_META = {
  food:    { label:'Terrasse', icon:'☀️', color:'#F8C83E', heat:'Terrasse à vérifier selon le soleil' },
  park:    { label:'Parc', icon:'🌳', color:'#2AB773', heat:'Ombre naturelle possible' },

function categoryFromTags(tags={}){
  const amenity=tags.amenity, leisure=tags.leisure, natural=tags.natural, landuse=tags.landuse, tourism=tags.tourism, shop=tags.shop;
  if(FOOD_AMENITIES.has(amenity)) return 'food';
  if(['park','garden','nature_reserve'].includes(leisure) || natural==='wood' || landuse==='forest') return 'park';
  if(['drinking_water','fountain'].includes(amenity)) return 'water';
  if(['parking','bicycle_parking'].includes(amenity)) return 'parking';
  if(['library','cinema'].includes(amenity) || tourism==='museum' || shop==='mall') return 'cool';
  return null;
}
function placeCategory(t){ return t?.category || 'food'; }
function isFoodPlace(t){ return placeCategory(t)==='food'; }
function placeCategoryMeta(t){ return PLACE_CATEGORY_META[placeCategory(t)] || PLACE_CATEGORY_META.food; }
function placeIcon(t){ return placeCategoryMeta(t).icon; }
function utilityHeatNote(t){ return placeCategoryMeta(t).heat; }
function typeLabel(a){return{bar:'Bar',cafe:'Café',restaurant:'Restaurant',pub:'Pub',biergarten:'Brasserie',drinking_water:'Point d’eau',fountain:'Fontaine',parking:'Parking',bicycle_parking:'Parking vélo',library:'Bibliothèque',cinema:'Cinéma'}[a]||'';}
function typeLabelFromTags(tags={}){
  if(FOOD_AMENITIES.has(tags.amenity)) return typeLabel(tags.amenity);
  if(tags.leisure==='park') return 'Parc';
  if(tags.leisure==='garden') return 'Jardin';
  if(tags.leisure==='nature_reserve') return 'Espace naturel';
  if(tags.natural==='wood' || tags.landuse==='forest') return 'Zone boisée';
  if(tags.tourism==='museum') return 'Musée · lieu frais';
  if(tags.shop==='mall') return 'Centre commercial · lieu frais';
  return typeLabel(tags.amenity) || PLACE_CATEGORY_META[categoryFromTags(tags)]?.label || 'Lieu';
}
function defaultPlaceName(tags={}, category){
  if(tags.name) return tags.name;
  if(tags.amenity==='drinking_water') return 'Point d’eau';
  if(tags.amenity==='fountain') return 'Fontaine';
  if(tags.amenity==='bicycle_parking') return 'Parking vélo';
  if(tags.amenity==='parking') return 'Parking';
  if(tags.leisure==='garden') return 'Jardin';
  if(tags.leisure==='park') return 'Parc';
  if(tags.natural==='wood' || tags.landuse==='forest') return 'Zone boisée';
  return PLACE_CATEGORY_META[category]?.label || '';
}
function coordsFromOsmFeature(f){
  if(Number.isFinite(f.lon) || Number.isFinite(f.center?.lon)) return {lng:f.lon ?? f.center.lon, lat:f.lat ?? f.center.lat};
  const coords=f.geometry?.coordinates;
  if(!coords) return null;
  const points=[];
  const collect=value=>{
    if(Array.isArray(value) && value.length>=2 && Number.isFinite(value[0]) && Number.isFinite(value[1])) points.push(value);
    else if(Array.isArray(value)) value.forEach(collect);
  };
  collect(coords);
  if(!points.length) return null;
  const sum=points.reduce((acc,p)=>({lng:acc.lng+p[0],lat:acc.lat+p[1]}),{lng:0,lat:0});
  return {lng:sum.lng/points.length, lat:sum.lat/points.length};
}
function osmFeatureToPlace(f,index,source='osm'){
  const props=f.properties || f.tags || {};
  const category=categoryFromTags(props);
  if(!category) return null;
  const coords=coordsFromOsmFeature(f);
  if(!coords || !Number.isFinite(coords.lat) || !Number.isFinite(coords.lng)) return null;
  const name=defaultPlaceName(props,category);
  if(!name || (category==='food' && String(name).trim().toLowerCase()==='el')) return null;
  return {
    id: props['@id'] || props.id || (f.id ? `${source}-${f.type||'node'}-${f.id}` : `${source}-${category}-${index}`),
    nom: name,
    adresse: props['addr:street'] ? ((props['addr:housenumber']||'')+' '+props['addr:street']).trim() : '',
    type: typeLabelFromTags(props),
    category,
    lng: coords.lng,
    lat: coords.lat,
    source
  };
}

function osmDataToTerrasses(data, source='osm'){
  const seen = new Set();
  return (data?.features || data?.elements || [])
    .map((f,index) => osmFeatureToPlace(f,index,source))
    .filter(t => {
      if(!t) return false;
      const key=t.category==='food'
        ? `${normalize(t.nom)}-${t.lat.toFixed(4)}-${t.lng.toFixed(4)}`
        : `${t.category}-${normalize(t.nom)}-${t.lat.toFixed(4)}-${t.lng.toFixed(4)}`;
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    })
}

const cityDataCache = {};
const cityScriptPromises = {};
function localDataPaths(id, ext){
  if(location.protocol === 'file:') return [`data/${id}.${ext}`, `outputs/data/${id}.${ext}`];
  return [`/data/${id}.${ext}`, `data/${id}.${ext}`];
}
async function loadCityDataScript(id){
  if(window.LOCAL_OSM_DATA?.[id]) return window.LOCAL_OSM_DATA[id];
  if(cityScriptPromises[id]) return cityScriptPromises[id];
  cityScriptPromises[id] = new Promise(resolve => {
    const paths = localDataPaths(id, 'js');
    let index = 0;
    const tryNext = () => {
      if(index >= paths.length){ resolve(null); return; }
      const script = document.createElement('script');
      script.src = paths[index++];
      script.async = true;
      script.onload = () => resolve(window.LOCAL_OSM_DATA?.[id] || null);
      script.onerror = () => { script.remove(); tryNext(); };
      document.head.appendChild(script);
    };
    tryNext();
  });
  return cityScriptPromises[id];
}
async function fetchLocalCityData(id){
  if(cityDataCache[id] !== undefined) return cityDataCache[id];
  if(window.LOCAL_OSM_DATA?.[id]){
    cityDataCache[id] = window.LOCAL_OSM_DATA[id];
    return cityDataCache[id];
  }
  for(const path of localDataPaths(id, 'json')){
    try{
      const res = await fetch(path, {cache:'force-cache'});
      if(!res.ok) throw new Error();
      cityDataCache[id] = await res.json();
      return cityDataCache[id];
    }catch(e){}
  }
  cityDataCache[id] = await loadCityDataScript(id);
  return cityDataCache[id];
}

const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const OVERPASS_RADIUS_METERS = 12000;
const OVERPASS_TIMEOUT_MS = 8500;
const OVERPASS_QUERY_TIMEOUT_SECONDS = 14;
const MAX_TERRASSES = 1800;
async function fetchTerrasses(){
  let local = [];
  const fallback = [...localFallbackTerrasses(), ...localFallbackUtilities()];
  if (!currentCity.dynamic) {
    try {
      const localData = await fetchLocalCityData(currentCity.id);
      if(localData) local = osmDataToTerrasses(localData,`local-${currentCity.id}`);
    } catch(e) {}
  }
  if(local.length > 80){
    const merged = mergeFeaturedPlaces(mergePlacesByIdentity([...local, ...fallback]));
    return merged.slice(0, MAX_TERRASSES);
  }

  const q=`[out:json][timeout:${OVERPASS_QUERY_TIMEOUT_SECONDS}];(
    nwr["amenity"~"^(bar|cafe|restaurant|pub|biergarten|drinking_water|fountain|parking|bicycle_parking|library|cinema)$"](around:${OVERPASS_RADIUS_METERS},${currentCity.lat},${currentCity.lng});
    nwr["leisure"~"^(park|garden|nature_reserve)$"](around:${OVERPASS_RADIUS_METERS},${currentCity.lat},${currentCity.lng});
    nwr["natural"="wood"](around:${OVERPASS_RADIUS_METERS},${currentCity.lat},${currentCity.lng});
    nwr["landuse"="forest"](around:${OVERPASS_RADIUS_METERS},${currentCity.lat},${currentCity.lng});
    nwr["tourism"="museum"](around:${OVERPASS_RADIUS_METERS},${currentCity.lat},${currentCity.lng});
    nwr["shop"="mall"](around:${OVERPASS_RADIUS_METERS},${currentCity.lat},${currentCity.lng});
  );out center tags;`;
  const overpassRequests=OVERPASS.map(async url=>{
      const r=await fetchWithTimeout(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(q)},OVERPASS_TIMEOUT_MS);
      if(!r.ok) throw new Error();
      const d=await r.json();
      if(!(d.elements||[]).length) throw new Error();
      const seen=new Set();
      return (d.elements||[])
        .map((el,index)=>osmFeatureToPlace(el,index,'osm'))
        .filter(el=>{
          if(!el) return false;
          if(!el.lat||!el.lng||!el.nom) return false;
          const key=`${el.category}-${normalize(el.nom)}-${el.lat.toFixed(4)}-${el.lng.toFixed(4)}`;
          if(seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .sort((a,b)=>metersBetween(currentCity.lat,currentCity.lng,a.lat,a.lng)-metersBetween(currentCity.lat,currentCity.lng,b.lat,b.lng));
  });
  const overpassPromise = Promise.any(overpassRequests).catch(()=>[]);
  try{
    const overpassPlaces = await overpassPromise;
    const merged = mergeFeaturedPlaces(mergePlacesByIdentity([...local, ...overpassPlaces, ...fallback]));
    return merged.slice(0, MAX_TERRASSES);
  }catch(e){
    const merged = mergeFeaturedPlaces(mergePlacesByIdentity([...local, ...fallback]));
    return merged.slice(0, MAX_TERRASSES);
  }
}

function getSunDir(jd){
  const s=Cesium.Simon1994PlanetaryPositions.computeSunPositionInEarthInertialFrame(jd);
  const m=Cesium.Transforms.computeIcrfToFixedMatrix(jd); if(!m) return null;
  const d=new Cesium.Cartesian3(); Cesium.Matrix3.multiplyByVector(m,s,d); return Cesium.Cartesian3.normalize(d,d);
}
function sceneReadyForShadows(relaxed=false){
  return !cameraMoving && viewer.scene.globe.tilesLoaded && (relaxed || osmBuildings.tilesLoaded) && typeof viewer.scene.pickFromRay==='function';
}
function sunAboveHorizon(lng,lat,sunDir){
  if(!sunDir) return null;
  const pos=Cesium.Cartesian3.fromDegrees(lng,lat,1);
  const up=Cesium.Cartesian3.normalize(pos,new Cesium.Cartesian3());
  return Cesium.Cartesian3.dot(sunDir,up)>0.01;
}
function checkSunnyPoint(lng,lat,sunDir){
  const carto=Cesium.Cartographic.fromDegrees(lng,lat);
  const terrainH=viewer.scene.globe.getHeight(carto);
  if(!Number.isFinite(terrainH)) return null;
  const pos=Cesium.Cartesian3.fromDegrees(lng,lat,terrainH+2.2);
  const up=Cesium.Cartesian3.normalize(pos,new Cesium.Cartesian3());
  if(Cesium.Cartesian3.dot(sunDir,up)<=0.0) return false;
  const origin=Cesium.Cartesian3.add(pos,Cesium.Cartesian3.multiplyByScalar(sunDir,2.8,new Cesium.Cartesian3()),new Cesium.Cartesian3());
  const hit=viewer.scene.pickFromRay(new Cesium.Ray(origin,sunDir),Object.values(markerEntities));
  if(!hit) return true;
  if(hit.position && Cesium.Cartesian3.distance(origin,hit.position)<5) return true;
  return false;
}
function checkSunny(t,sunDir,relaxed=false){
  if(!sunDir) return null;
  if(!ENABLE_SHADOW_RAYCASTS) return sunAboveHorizon(t.lng,t.lat,sunDir);
  if(!sceneReadyForShadows(relaxed)) return sunAboveHorizon(t.lng,t.lat,sunDir);
  const latMeter=1/111320;
  const lngMeter=1/(111320*Math.max(0.2,Math.cos(t.lat*Math.PI/180)));
  const offsets=[
    [0,0],[7,0],[-7,0],[0,7],[0,-7],[5,5],[-5,5],[5,-5],[-5,-5],
    [12,0],[-12,0],[0,12],[0,-12],[9,9],[-9,9],[9,-9],[-9,-9],
    [18,0],[-18,0],[0,18],[0,-18]
  ];
  let sunny=0, valid=0;
  for(const [east,north] of offsets){
    const result=checkSunnyPoint(t.lng+east*lngMeter,t.lat+north*latMeter,sunDir);
    if(result===null) continue;
    valid++;
    if(result) sunny++;
  }
  if(valid<3) return sunAboveHorizon(t.lng,t.lat,sunDir);
  return sunny>0;
}

let cameraMoving=false;
viewer.camera.moveStart.addEventListener(()=>{cameraMoving=true;});
viewer.camera.moveEnd.addEventListener(()=>{cameraMoving=false;});

let shadowDebounce=null,computing=false,shadowVersion=0,shadowPending=false;
function computeFastSunStates(){
  const sunDir=getSunDir(viewer.clock.currentTime);
  terrasses.forEach(t=>{sunStates[t.id]=sunAboveHorizon(t.lng,t.lat,sunDir);});
}
function scheduleShadow(){
  if(!ENABLE_SHADOW_RAYCASTS){
    shadowPending = false;
    clearTimeout(shadowDebounce);
    computeFastSunStates();
    requestAnimationFrame(()=>{syncDots(); refreshActivePlaceSunStatus();});
    return;
  }
  shadowPending = true;
  clearTimeout(shadowDebounce);
  shadowDebounce=setTimeout(()=>{
    if(cameraMoving) return;
    const unsub=viewer.scene.postRender.addEventListener(()=>{ unsub(); runShadow(); });
  }, 150);
}
async function runShadow(){
  if(!ENABLE_SHADOW_RAYCASTS){
    computing=false;
    shadowPending=false;
    computeFastSunStates();
    syncDots();
    refreshActivePlaceSunStatus();
    return;
  }
  if(computing || cameraMoving) return;
  computing=true; shadowPending=false; const version=++shadowVersion;
  const jd=viewer.clock.currentTime; const sunDir=getSunDir(jd);
  for(let i=0;i<terrasses.length;i+=45){
    if(version!==shadowVersion||cameraMoving){computing=false;if(shadowPending)scheduleShadow();return;}
    const batch=terrasses.slice(i,i+45);
    for(const t of batch) sunStates[t.id]=checkSunny(t,sunDir,true);
    syncDots(batch);
    refreshActivePlaceSunStatus();
    await new Promise(r=>setTimeout(r,0));
  }
  // Une seule reconstruction de la liste à la fin (évite le clignotement)
  renderList(currentHeure,searchQuery);
  refreshActivePlaceSunStatus();
  computing=false;
  if(shadowPending) scheduleShadow();
}

function markerImageForPlace(t){
  const ref=findReferenced(t.nom);
  if(ref) return DOT_FEATURED;
  if(!isFoodPlace(t)) return DOT_CATEGORY[placeCategory(t)] || DOT_CATEGORY.cool;
  const s=sunStates[t.id];
  return s===true?DOT_SUN:s===false?DOT_SHADE:DOT_UNKNOWN;
}
function markerSizeForPlace(t){
  if(findReferenced(t.nom)) return 34;
  return isFoodPlace(t) ? 18 : 26;
}

let markerRenderToken=0;
function prioritizedMarkerItems(items=terrasses){
  const source = Array.isArray(items) ? items : terrasses;
  const sorted = [...source].sort((a,b)=>{
    const ra=findReferenced(a.nom)?0:(isFoodPlace(a)?2:1);
    const rb=findReferenced(b.nom)?0:(isFoodPlace(b)?2:1);
    if(ra!==rb) return ra-rb;
    if(userLat!==null) return distMeters(a.lat,a.lng)-distMeters(b.lat,b.lng);
    return metersBetween(currentCity.lat,currentCity.lng,a.lat,a.lng)-metersBetween(currentCity.lat,currentCity.lng,b.lat,b.lng);
  });
  return sorted.slice(0, MAX_MARKERS_ON_MAP);
}

function syncDots(items=terrasses){
  const token=++markerRenderToken;
  const fullRefresh = !items || items===terrasses || items.length===terrasses.length;
  const mapItems = fullRefresh ? terrasses.filter(matchesActiveFilter) : items;
  const targets=fullRefresh ? prioritizedMarkerItems(mapItems) : mapItems;
  if(fullRefresh){
    const visibleIds=new Set(targets.map(t=>String(t.id)));
    Object.keys(markerEntities).forEach(id=>{
      if(!visibleIds.has(String(id))) markerEntities[id].show=false;
    });
  }
  let index=0;
  const renderBatch=()=>{
    if(token!==markerRenderToken) return;
    const end=Math.min(index+MARKER_RENDER_BATCH,targets.length);
    for(;index<end;index++){
      const t=targets[index];
      const img=markerImageForPlace(t);
      const size=markerSizeForPlace(t);
      if(!markerEntities[t.id]){
        markerEntities[t.id]=viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(t.lng,t.lat,2),billboard:{image:img,verticalOrigin:Cesium.VerticalOrigin.CENTER,heightReference:Cesium.HeightReference.RELATIVE_TO_GROUND,width:size,height:size,disableDepthTestDistance:Number.POSITIVE_INFINITY},properties:{id:t.id}});
      }else{
        markerEntities[t.id].billboard.image=img;
        markerEntities[t.id].billboard.width=size;
        markerEntities[t.id].billboard.height=size;
        markerEntities[t.id].show=true;
      }
    }
    if(index<targets.length) requestAnimationFrame(renderBatch);
  };
  requestAnimationFrame(renderBatch);
}

const FEATURED_RADIUS_METERS = 12000;
function findReferenced(nom){
  const n=(nom||'').toLowerCase().trim();
  return REFERENCED.find(p=>{
    const names=[p.match,...(p.aliases||[])].map(x=>x.toLowerCase().trim());
    return names.some(pm=>n===pm || n.includes(pm) || pm.includes(n));
  })||null;
}
// alias pour compat
function findPartner(nom){ return findReferenced(nom); }
function referencedRank(nom){
  const ref=findReferenced(nom);
  return ref ? REFERENCED.indexOf(ref) : 999;
}

function referencedToPlace(ref){
  return {
    id:`featured-${normalize(ref.match).replace(/[^a-z0-9]+/g,'-')}`,
    nom:ref.match,
    adresse:ref.adresse||'',
    type:ref.type||'Restaurant',
    lng:ref.lng,
    lat:ref.lat,
    featured:true
  };
}

function mergeFeaturedPlaces(items){
  const places=[...items];
  const existing=new Set(places.map(t=>normalize(t.nom)));
  REFERENCED.forEach(ref=>{
    if(!ref.lat||!ref.lng) return;
    const nearArea = metersBetween(currentCity.lat,currentCity.lng,ref.lat,ref.lng) <= FEATURED_RADIUS_METERS;
    if(!nearArea) return;
    const aliases=[ref.match,...(ref.aliases||[])].map(normalize);
    const already=aliases.some(name=>existing.has(name)) || places.some(t=>aliases.some(name=>normalize(t.nom).includes(name)||name.includes(normalize(t.nom))));
    if(!already) places.unshift(referencedToPlace(ref));
  });
  return places;
}

function hasGoogleMapsKey(){
  const key = (GOOGLE_MAPS_API_KEY || '').trim();
  return key.length > 8 && !/^AIzaSyA_REMPLACER/i.test(key);
}

let googlePlacesLoaderPromise = null;
let googlePlacesService = null;
function loadGooglePlacesLibrary(){
  if(!hasGoogleMapsKey()) return Promise.resolve(false);
  if(window.google?.maps?.places) return Promise.resolve(true);
  if(googlePlacesLoaderPromise) return googlePlacesLoaderPromise;
  googlePlacesLoaderPromise = new Promise(resolve => {
    const callbackName = `initGooglePlaces_${Date.now()}`;
    window[callbackName] = () => {
      delete window[callbackName];
      resolve(!!window.google?.maps?.places);
    };
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY.trim())}&loading=async&libraries=places&callback=${callbackName}`;
    script.async = true;
    script.defer = true;
    script.onerror = () => {
      delete window[callbackName];
      resolve(false);
    };
    document.head.appendChild(script);
  });
  return googlePlacesLoaderPromise;
}

async function getGooglePlacesService(){
  const ready = await loadGooglePlacesLibrary();
  if(!ready) return null;
  if(!googlePlacesService) googlePlacesService = new google.maps.places.PlacesService(document.createElement('div'));
  return googlePlacesService;
}

function googleStatusOk(status){
  return window.google?.maps?.places && status === google.maps.places.PlacesServiceStatus.OK;
}

function latLngFromGoogle(place){
  const loc = place?.geometry?.location;
  if(!loc) return null;
  const lat = typeof loc.lat === 'function' ? loc.lat() : loc.lat;
  const lng = typeof loc.lng === 'function' ? loc.lng() : loc.lng;
  if(!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
  return {lat,lng};
}

function googlePhotoFromPlace(place, maxWidth=1100){
  try {
    return place?.photos?.[0]?.getUrl({maxWidth, maxHeight:760}) || '';
  } catch(e) {
    return '';
  }
}

function stripAttribution(attrs){
  const raw = (attrs || []).join(' ').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
  return raw.slice(0, 90);
}

function normalizeGoogleJsPlace(place){
  if(!place) return {};
  const coords = latLngFromGoogle(place);
  return {
    photo: googlePhotoFromPlace(place),
    photoAttribution: stripAttribution(place.photos?.[0]?.html_attributions),
    rating: place.rating || '',
    userRatingCount: place.user_ratings_total || '',
    tel: place.international_phone_number || place.formatted_phone_number || '',
    websiteUrl: place.website || '',
    googleMapsUrl: place.url || (place.place_id ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name||'Restaurant')}&query_place_id=${encodeURIComponent(place.place_id)}` : ''),
    reservationUrl: place.url || '',
    googlePlaceId: place.place_id || '',
    lat: coords?.lat,
    lng: coords?.lng
  };
}

async function findGooglePlaceInBrowser(t){
  const service = await getGooglePlacesService();
  if(!service) return {};
  const query = `${t.nom} ${t.adresse || currentCity.nom || 'France'}`;
  return new Promise(resolve => {
    service.findPlaceFromQuery({query, fields:['place_id','name','geometry']}, (results, status) => {
      if(!googleStatusOk(status) || !results?.[0]?.place_id) { resolve({}); return; }
      service.getDetails({
        placeId: results[0].place_id,
        fields:['name','place_id','geometry','photos','formatted_phone_number','international_phone_number','website','url','rating','user_ratings_total']
      }, (place, detailsStatus) => {
        if(!googleStatusOk(detailsStatus)) { resolve({}); return; }
        const coords = latLngFromGoogle(place);
        const closeEnough = coords ? metersBetween(t.lat,t.lng,coords.lat,coords.lng) < 1500 : true;
        const similarName = normalize(place?.name || '').includes(normalize(t.nom).slice(0, 8)) || normalize(t.nom).includes(normalize(place?.name || '').slice(0, 8));
        resolve(closeEnough || similarName ? normalizeGoogleJsPlace(place) : {});
      });
    });
  });
}

function googlePlaceTypeLabel(place, fallbackType){
  const types = place?.types || [];
  if(types.includes('cafe')) return 'Café';
  if(types.includes('bar')) return 'Bar';
  if(types.includes('restaurant')) return 'Restaurant';
  return fallbackType === 'cafe' ? 'Café' : fallbackType === 'bar' ? 'Bar' : 'Restaurant';
}

function googlePlaceToTerrasse(place, fallbackType){
  const coords = latLngFromGoogle(place);
  if(!coords || !place?.name || !place?.place_id) return null;
  return {
    id:`google-${place.place_id}`,
    nom:place.name,
    adresse:place.vicinity || place.formatted_address || '',
    type:googlePlaceTypeLabel(place, fallbackType),
    category:'food',
    lng:coords.lng,
    lat:coords.lat,
    source:'google',
    googlePlaceId:place.place_id,
    googleDetails:normalizeGoogleJsPlace(place)
  };
}

function googleNearbySearch(service, type){
  return new Promise(resolve => {
    const found = [];
    let pages = 0;
    const request = {
      location:new google.maps.LatLng(currentCity.lat, currentCity.lng),
      radius:GOOGLE_NEARBY_RADIUS_METERS,
      type
    };
    const collect = (results, status, pagination) => {
      if(status === google.maps.places.PlacesServiceStatus.ZERO_RESULTS) { resolve(found); return; }
      if(!googleStatusOk(status)) { resolve(found); return; }
      (results || []).forEach(place => {
        const t = googlePlaceToTerrasse(place, type);
        if(t) found.push(t);
      });
      if(pagination?.hasNextPage && pages < 2) {
        pages++;
        setTimeout(() => pagination.nextPage(), 450);
      } else {
        resolve(found);
      }
    };
    service.nearbySearch(request, collect);
  });
}

async function fetchGoogleNearbyTerrasses(){
  const service = await getGooglePlacesService();
  if(!service) return [];
  const groups = await Promise.all(GOOGLE_NEARBY_TYPES.map(type => googleNearbySearch(service, type)));
  return mergePlacesByIdentity(groups.flat());
}

function mergePlacesByIdentity(items){
  const clean = (items || []).filter(t => t && t.nom && Number.isFinite(t.lat) && Number.isFinite(t.lng));
  const out = [];
  clean.forEach(item => {
    const n = normalize(item.nom);
    const duplicate = out.find(existing => {
      const e = normalize(existing.nom);
      const closeName = e === n || e.includes(n) || n.includes(e);
      return placeCategory(existing) === placeCategory(item) && closeName && metersBetween(existing.lat,existing.lng,item.lat,item.lng) < 140;
    });
    if(duplicate){
      Object.assign(duplicate, {...item, ...duplicate, googleDetails:item.googleDetails || duplicate.googleDetails});
    } else {
      out.push(item);
    }
  });
  return out.sort((a,b)=>metersBetween(currentCity.lat,currentCity.lng,a.lat,a.lng)-metersBetween(currentCity.lat,currentCity.lng,b.lat,b.lng));
}

const googlePlaceCache={};
async function fetchGooglePlace(t){
  if(Object.prototype.hasOwnProperty.call(googlePlaceCache,t.id)) return googlePlaceCache[t.id];
  const key=placeKey(t);
  if(Object.prototype.hasOwnProperty.call(googlePlaceCache,key)) return googlePlaceCache[key];
  if(t.googleDetails){
    googlePlaceCache[t.id]=t.googleDetails;
    googlePlaceCache[key]=t.googleDetails;
    return googlePlaceCache[t.id];
  }
  const browserDetails = await findGooglePlaceInBrowser(t);
  if(browserDetails.photo || browserDetails.rating || browserDetails.tel || browserDetails.googleMapsUrl || browserDetails.websiteUrl){
    googlePlaceCache[t.id]=browserDetails;
    googlePlaceCache[key]=browserDetails;
    return googlePlaceCache[t.id];
  }
  if(!/^https?:$/.test(location.protocol)){
    googlePlaceCache[t.id]={};
    googlePlaceCache[key]={};
    return {};
  }
  try{
    const r=await fetch(`/api/google-place?name=${encodeURIComponent(t.nom)}&lat=${t.lat}&lng=${t.lng}&city=${encodeURIComponent(currentCity.nom||'')}`);
    if(!r.ok) throw new Error();
    const data=await r.json();
    googlePlaceCache[t.id]=data||{};
    googlePlaceCache[key]=googlePlaceCache[t.id];
    return googlePlaceCache[t.id];
  }catch(e){
    googlePlaceCache[t.id]={};
    googlePlaceCache[key]={};
    return {};
  }
}

function normalize(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function distMeters(lat,lng){if(userLat===null)return Infinity;return Math.hypot((lat-userLat)*111320,(lng-userLng)*111320*Math.cos(userLat*Math.PI/180));}
function distKm(lat,lng){if(userLat===null)return '';const d=distMeters(lat,lng)/1000;return d<1?`à ${Math.round(d*1000)} m`:`à ${d.toFixed(1)} km`;}
function sunStateClass(state){return state===true?'sun':state===false?'shade':'unknown';}
function sunStateLabel(state){
  return state===true?'☀️ Au soleil':state===false?'À l’ombre':'Calcul…';
}
function compactSunStateLabel(state){

function highlight(text,q){
  const safe=escapeHTML(text);
  if(!q) return safe;
  const escaped=escapeHTML(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return safe.replace(new RegExp(`(${escaped})`,'gi'),'<mark style="background:#FFF7D6;color:#8A6400;border-radius:4px;padding:0 2px">$1</mark>');
}

function matchesActiveFilter(t){
  const type=normalize(t.type);
  const category=placeCategory(t);
  if(activeFilter==='favorite') return isFavorite(t)||!!findReferenced(t.nom);
  if(activeFilter==='heatwave') {
    if(category==='parking') return false;
    return ['park','water','cool'].includes(category);
  }
  if(activeFilter==='park') return category==='park';
  if(activeFilter==='water') return category==='water';
  if(activeFilter==='parking') return category==='parking';
  if(activeFilter==='cool') return category==='cool';
  if(activeFilter==='restaurant') return isFoodPlace(t) && (type.includes('restaurant')||type.includes('brasserie')||type.includes('bistrot'));
  if(activeFilter==='cafe') return isFoodPlace(t) && type.includes('cafe');
  if(activeFilter==='bar') return isFoodPlace(t) && (type.includes('bar')||type.includes('pub'));
  return true;
}

  const sorted=[...filtered].sort((a,b)=>{
    const pa=findReferenced(a.nom)?1:0, pb=findReferenced(b.nom)?1:0;

      if(ca!==cb) return ca-cb;
    }
    const fa=isFavorite(a)?1:0, fb=isFavorite(b)?1:0;
    if(fa!==fb) return fb-fa;
    return distMeters(a.lat,a.lng)-distMeters(b.lat,b.lng);

    }else if(!isFoodPlace(t)){
      const category=placeCategory(t);
      card.innerHTML=`<div class="category-icon ${escapeAttr(category)}">${escapeHTML(placeIcon(t))}</div><div class="card-body"><div class="card-name">${highlight(t.nom,query)}</div><div class="card-sub">${escapeHTML(t.type)}${t.adresse?' · '+escapeHTML(t.adresse):''}${dist?' · '+escapeHTML(dist):''}</div><div class="card-meta"><span class="utility-tag heat">${escapeHTML(utilityHeatNote(t))}</span></div></div>`;
    }else{
      card.innerHTML=`<div class="card-body"><div class="card-name">${highlight(t.nom,query)}</div><div class="card-sub">${escapeHTML(t.type)}${t.adresse?' · '+escapeHTML(t.adresse):''}${dist?' · '+escapeHTML(dist):''}</div></div>`;
    }
    card.addEventListener('click',()=>selectTerrasse(t,card));
    fragment.appendChild(card);
  });
  if(allListItems.length>listItems.length){
    const more=document.createElement('div');
    more.className='no-results';
    more.innerHTML=`${allListItems.length-listItems.length} autres résultats disponibles avec la recherche.`;
    fragment.appendChild(more);
  }
  list.appendChild(fragment);
  const hydrateTargets=[...refTerrasses,...listItems.filter(t=>findReferenced(t.nom))].filter((item,index,self)=>self.findIndex(other=>String(other.id)===String(item.id))===index);
  setTimeout(()=>hydrateVisiblePhotos(hydrateTargets), 80);
}

const searchInput=document.getElementById('searchInput'),searchClear=document.getElementById('searchClear');
searchInput.addEventListener('input',e=>{searchQuery=e.target.value;document.getElementById('drawerSearch').value=searchQuery;searchClear.classList.toggle('visible',searchQuery.length>0);renderList(currentHeure,searchQuery);if(searchQuery.length>0)openDrawer();});
searchClear.addEventListener('click',()=>{searchInput.value='';searchQuery='';document.getElementById('drawerSearch').value='';searchClear.classList.remove('visible');renderList(currentHeure,'');});
document.getElementById('drawerSearch').addEventListener('input',e=>{searchQuery=e.target.value;searchInput.value=searchQuery;searchClear.classList.toggle('visible',searchQuery.length>0);renderList(currentHeure,searchQuery);});
document.getElementById('filterChips').addEventListener('click',e=>{
  const chip=e.target.closest('.filter-chip');
  if(!chip) return;
  if(chip.dataset.city){
    switchCity(chip.dataset.city);
    return;
  }
  activeFilter=chip.dataset.filter||'all';
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active',c===chip));
  renderList(currentHeure,searchQuery);
  syncDots();
});

const slider=document.getElementById('timeSlider');
let sliderUiTimer=null;
slider.addEventListener('input',e=>{
  const val=parseFloat(e.target.value),h=Math.floor(val),m=Math.round((val-h)*60);
  document.getElementById('heureAffichee').textContent=h+'h'+(m<10?'0'+m:m);
  slider.style.setProperty('--pct',((val-6)/15)*100+'%');
  currentDate=new Date(); currentDate.setHours(h,m,0,0);
  viewer.clock.currentTime=Cesium.JulianDate.fromDate(currentDate); currentHeure=val;
  if(terrasses.length>0){
    shadowVersion++;
    if(ENABLE_SHADOW_RAYCASTS){
      terrasses.forEach(t=>{sunStates[t.id]=null;});
      clearTimeout(sliderUiTimer);
      sliderUiTimer=setTimeout(()=>{
        syncDots();
        renderList(currentHeure,searchQuery);
        refreshActivePlaceSunStatus();
      }, 90);
      scheduleShadow();
    }else{
      computeFastSunStates();
      syncDots();
      refreshActivePlaceSunStatus();
      clearTimeout(sliderUiTimer);
      sliderUiTimer=setTimeout(()=>renderList(currentHeure,searchQuery), 80);
    }
  }
});
slider.addEventListener('change',e=>{
  if(terrasses.length>0){
    shadowVersion++;
    if(ENABLE_SHADOW_RAYCASTS) scheduleShadow();
    else { computeFastSunStates(); syncDots(); renderList(currentHeure,searchQuery); refreshActivePlaceSunStatus(); }
  }
});

const handler=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
handler.setInputAction(click=>{
  const picked=viewer.scene.pick(click.position);
  if(Cesium.defined(picked)&&picked.id){
    const id=picked.id.properties?.id?.getValue();
    const t=terrasses.find(x=>String(x.id)===String(id));
    if(t){
      if(isFeaturedOrFavorite(t)) showPlaceSheet(t);
      else showTooltip(t,click.position.x,click.position.y);
      return;
    }
  }
  hidePlaceSheet();
},Cesium.ScreenSpaceEventType.LEFT_CLICK);

function areaSignature(){
  return `${currentCity.id}:${currentCity.lat.toFixed(4)}:${currentCity.lng.toFixed(4)}`;
}

function paintTerrasses(data, suffix=''){
  document.getElementById('loadingState').style.display='none';
  document.getElementById('terrasseList').style.display='block';
  terrasses=data;
  lastLoadedArea={lat:currentCity.lat,lng:currentCity.lng};
  sunStates={};
  terrasses.forEach(t=>{sunStates[t.id]=sunStates[t.id] ?? null;});
  primeSunStates();
  document.getElementById('footerText').textContent=`${terrasses.length} lieux · ${currentCity.nom}${suffix}`;
  renderList(currentHeure,searchQuery);
  const launch=()=>{
    syncDots();
    if (ENABLE_SHADOW_RAYCASTS) {
      if (viewer.scene.globe.tilesLoaded) { runShadow(); } else { scheduleShadow(); }
    }
  };
  if(splashDone) launch();
  else{const w=setInterval(()=>{if(splashDone){clearInterval(w);launch();}},100);}
}

let nearbyHydrationVersion=0;
async function hydrateNearbyInBackground(signature){
  const version=++nearbyHydrationVersion;
  try{
    const googlePlaces=await fetchGoogleNearbyTerrasses();
    if(version!==nearbyHydrationVersion || signature!==areaSignature() || !googlePlaces.length) return;
    const merged=mergeFeaturedPlaces(mergePlacesByIdentity([...terrasses,...googlePlaces])).slice(0,MAX_TERRASSES);
    paintTerrasses(merged);
  }catch(e){}
}

let utilityHydrationVersion=0;
async function hydrateUtilitiesInBackground(signature){
  const version=++utilityHydrationVersion;
  try{
    const utilities=await fetchUtilityPlacesFromOverpass();
    if(version!==utilityHydrationVersion || signature!==areaSignature() || !utilities.length) return;
    const merged=mergeFeaturedPlaces(mergePlacesByIdentity([...terrasses,...utilities])).slice(0,MAX_TERRASSES);
    paintTerrasses(merged);
  }catch(e){}
}

let terraceLoadVersion=0;
async function loadTerrasses(){
  document.getElementById('loadingState').style.display='flex';
  document.getElementById('terrasseList').style.display='none';
  const signature=areaSignature();
  const version=++terraceLoadVersion;
  const quick=mergeFeaturedPlaces(mergePlacesByIdentity([...localFallbackTerrasses(), ...localFallbackUtilities()])).slice(0,MAX_TERRASSES);
  await preloadGooglePhotosForFeatured(quick);
  paintTerrasses(quick,' · chargement…');

  fetchTerrasses().then(data=>{
    if(version!==terraceLoadVersion || signature!==areaSignature()) return;
    paintTerrasses(data);
    setTimeout(()=>hydrateUtilitiesInBackground(signature), 700);
    setTimeout(()=>hydrateNearbyInBackground(signature), 3500);
  }).catch(()=>{
    if(version!==terraceLoadVersion || terrasses.length) return;
    document.getElementById('loadingState').style.display='none';
    document.getElementById('terrasseList').style.display='block';
    document.getElementById('terrasseList').innerHTML=`<div class="no-results">Impossible de charger les lieux.<br><button onclick="loadTerrasses()" style="margin-top:8px;background:#FFD600;border:none;padding:10px 20px;border-radius:12px;font-weight:600;cursor:pointer;font-size:14px;">Réessayer</button></div>`;
  });
}

async function init(){
  const now=new Date();
  const initH=Math.min(21,Math.max(6,now.getHours()+(Math.round(now.getMinutes()/15)*15/60)));
  slider.value=initH;
  slider.dispatchEvent(new Event('input'));
  loadGooglePlacesLibrary();
  loadTerrasses();

  // Géoloc auto ensuite : l'app reste utilisable pendant que le GPS répond.
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async pos=>{
      const {longitude:lng,latitude:lat,accuracy}=pos.coords;
      placeUserDot(lng,lat,accuracy);
      await setCurrentArea(lat,lng);
      focusUser(lng,lat,false);
      loadTerrasses();
      // Affinage : une 2e mesure GPS plus précise arrive souvent après 1-2s
      let refined=false;
      const wid=navigator.geolocation.watchPosition(async p=>{
        const {longitude:l2,latitude:la2,accuracy:a2}=p.coords;
        placeUserDot(l2,la2,a2);
        if(!refined){ refined=true; focusUser(l2,la2,true); }
        const moved = lastLoadedArea ? metersBetween(lastLoadedArea.lat,lastLoadedArea.lng,la2,l2) : Infinity;
        if(moved>2500){
          await setCurrentArea(la2,l2);
          clearPlaces();
          focusUser(l2,la2,true);
          loadTerrasses();
        }
      },()=>{},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
      setTimeout(()=>navigator.geolocation.clearWatch(wid), 20000);
    },()=>{}, {enableHighAccuracy:true,timeout:4500,maximumAge:15000});
  }
}

init();
</script>
